    <script>
      // Đặt theme trước khi React chạy để không bị nháy sáng/tối.
      // auto: 06:00–17:59 giờ máy người truy cập = sáng, còn lại = tối.
      (function () {
        try {
          var m = localStorage.getItem("aether-theme-mode") || "auto";
          var h = new Date().getHours();
          var t = m === "auto" ? (h >= 6 && h < 18 ? "light" : "dark") : m;
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
